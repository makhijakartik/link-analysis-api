<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Website Link Analysis</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>AI Website Link Analysis</h1>
      <p class="subtitle">Enter a website URL to get competitor, SEO, search-query, services, and target-audience insights.</p>
    </header>

    <form id="analysis-form">
      <input type="url" id="url-input" placeholder="https://example.com" required />
      <button type="submit" id="submit-btn">Analyze</button>
    </form>

    <div id="status" class="status hidden"></div>
    <div id="results" class="results hidden"></div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
